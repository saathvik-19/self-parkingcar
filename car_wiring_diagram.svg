<text x="310" y="470" font-size="12" text-anchor="start" fill="#222" font-weight="normal">GND</text>
<rect x="980" y="150" width="190" height="150" rx="8" fill="#e6efff" stroke="#1d6fd6" stroke-width="2"/>
