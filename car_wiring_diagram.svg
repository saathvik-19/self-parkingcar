<text x="992" y="240" font-size="12" text-anchor="start" fill="#222" font-weight="normal">ECHO</text>
<text x="992" y="270" font-size="12" text-anchor="start" fill="#222" font-weight="normal">GND</text>
<line x1="860" y1="175" x2="980" y2="175" stroke="#d62828" stroke-width="3" stroke-linecap="round"/>
<text x="850" y="180" font-size="12" text-anchor="end" fill="#222" font-weight="normal">VIN</text>
<line x1="860" y1="205" x2="980" y2="205" stroke="#1d6fd6" stroke-width="3" stroke-linecap="round"/>
<text x="850" y="210" font-size="12" text-anchor="end" fill="#222" font-weight="normal">GPIO 19</text>
<line x1="860" y1="235" x2="885" y2="235" stroke="#1d6fd6" stroke-width="3" stroke-linecap="round"/>
<circle cx="885" cy="235" r="4" fill="#1d6fd6"/>
<line x1="885" y1="235" x2="905" y2="235" stroke="#1d6fd6" stroke-width="3" stroke-linecap="round"/>
<rect x="905" y="226" width="50" height="18" fill="white" stroke="#555" stroke-width="2"/>
<text x="930" y="239" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">1k</text>
<line x1="955" y1="235" x2="980" y2="235" stroke="#1d6fd6" stroke-width="3" stroke-linecap="round"/>
<text x="850" y="240" font-size="12" text-anchor="end" fill="#222" font-weight="normal">GPIO 34</text>
<line x1="885" y1="235" x2="885" y2="262" stroke="#1d6fd6" stroke-width="3" stroke-linecap="round"/>
<rect x="868" y="262" width="34" height="40" fill="white" stroke="#555" stroke-width="2"/>
<text x="885" y="286" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">2k</text>
<line x1="885" y1="302" x2="885" y2="320" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<text x="885" y="336" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">GND</text>
<line x1="980" y1="265" x2="960" y2="265" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<text x="955" y="269" font-size="11" text-anchor="end" fill="#222" font-weight="normal">GND</text>
<rect x="980" y="360" width="190" height="130" rx="8" fill="#fff0e0" stroke="#f26b00" stroke-width="2"/>
<text x="1075.0" y="382" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">MICRO SERVO</text>
<text x="992" y="400" font-size="12" text-anchor="start" fill="#222" font-weight="normal">Signal</text>
<text x="992" y="430" font-size="12" text-anchor="start" fill="#222" font-weight="normal">5V</text>
<text x="992" y="460" font-size="12" text-anchor="start" fill="#222" font-weight="normal">GND</text>
<line x1="860" y1="395" x2="980" y2="395" stroke="#f26b00" stroke-width="3" stroke-linecap="round"/>
<text x="850" y="400" font-size="12" text-anchor="end" fill="#222" font-weight="normal">GPIO 18</text>
<line x1="980" y1="425" x2="950" y2="425" stroke="#d62828" stroke-width="3" stroke-linecap="round"/>
<text x="945" y="429" font-size="11" text-anchor="end" fill="#d62828" font-weight="normal">5V rail</text>
<line x1="980" y1="455" x2="950" y2="455" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<text x="945" y="459" font-size="11" text-anchor="end" fill="#222" font-weight="normal">GND rail</text>
<rect x="905" y="500" width="150" height="40" rx="6" fill="#f3f3f3" stroke="#555" stroke-width="2"/>
<text x="980" y="525" font-size="11" text-anchor="middle" fill="#222" font-weight="normal">470-1000 uF across 5V / GND</text>
<rect x="30" y="580" width="1140" height="250" rx="8" fill="#fafafa" stroke="#ccc"/>
<text x="50" y="606" font-size="15" text-anchor="start" fill="#111" font-weight="bold">Rules that matter</text>
<text x="50" y="632" font-size="13" text-anchor="start" fill="#222" font-weight="normal">1. 5V rail: L298N 5V terminal -> ESP32 VIN. The sensor VCC and servo red wire also connect to this rail.</text>
<text x="50" y="653" font-size="13" text-anchor="start" fill="#222" font-weight="normal">2. Common ground: battery -, L298N GND, ESP32 GND, sensor GND and servo GND must ALL be joined.</text>
<text x="50" y="674" font-size="13" text-anchor="start" fill="#222" font-weight="normal">3. ECHO is 5 V and the ESP32 is 3.3 V: 1k in series, 2k to GND, ESP32 pin taken from the middle. Never wire ECHO straight in.</text>
<text x="50" y="695" font-size="13" text-anchor="start" fill="#222" font-weight="normal">4. Pull the ENA / ENB jumper caps off the L298N, or the motors ignore the speed commands.</text>
<text x="50" y="716" font-size="13" text-anchor="start" fill="#222" font-weight="normal">5. Put the 470-1000 uF capacitor close to the servo (stripe to GND). Motor surges can reset an ESP32 without it.</text>
<text x="50" y="737" font-size="13" text-anchor="start" fill="#222" font-weight="normal">6. Unplug the battery while the ESP32 is on USB, so the two 5 V supplies never fight.</text>
<text x="50" y="758" font-size="13" text-anchor="start" fill="#222" font-weight="normal">7. Left motors to OUT1/OUT2, right motors to OUT3/OUT4. Swap a motor's two wires if its wheel spins backward.</text>
<text x="50" y="779" font-size="13" text-anchor="start" fill="#222" font-weight="normal">8. Mount the sensor so it sticks out past the front of the box: the beam must not hit cardboard when the servo turns it sideways.</text>
<text x="50" y="800" font-size="13" text-anchor="start" fill="#222" font-weight="normal">Pins avoid the ESP32 boot pins (0, 2, 12, 15) and flash pins (6-11). GPIO 34 is input-only, which suits an echo line.</text>
</svg>