<rect x="30" y="410" width="170" height="100" rx="8" fill="#fff4d6" stroke="#b8860b" stroke-width="2"/>
<text x="115.0" y="432" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">BATTERY 7-9V</text>
<text x="115" y="462" font-size="12" text-anchor="middle" fill="#666" font-weight="normal">2x18650 + switch</text>
<line x1="200" y1="430" x2="300" y2="430" stroke="#d62828" stroke-width="3" stroke-linecap="round"/>
